name: iPhone and iPad app

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['ios/**', 'shared/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'shared/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    name: iOS 27 SDK · iPhone + iPad tests, screenshots, IPA
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
          xcodebuild -version

      - name: Pick simulators
        working-directory: ios
        run: |
          echo "IPHONE=$(python3 ci/pick-simulator.py iPhone)" >> "$GITHUB_ENV"
          echo "IPAD=$(python3 ci/pick-simulator.py iPad)" >> "$GITHUB_ENV"

      - name: Unit tests on iPhone and iPad (iOS 27)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test -project Notakillite.xcodeproj -scheme Notakillite -derivedDataPath build/dd \
            -destination "id=$IPHONE" -destination "id=$IPAD" CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E "error:|Test Case.*(passed|failed)|Executed|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" test.log

      - name: Screenshots (sample data)
        working-directory: ios
        run: |
          APP=build/dd/Build/Products/Debug-iphonesimulator/Notakillite.app
          bash ci/screenshot.sh "$IPHONE" "$APP" build/screenshots/iphone-ios27.png light
          bash ci/screenshot.sh "$IPAD" "$APP" build/screenshots/ipad-ios27-dark.png dark

      - name: Build unsigned IPA (iOS 27 SDK, runs on iOS/iPadOS 18+)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive -project Notakillite.xcodeproj -scheme Notakillite -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Notakillite.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -5
          mkdir -p build/ipa/Payload
          cp -R build/Notakillite.xcarchive/Products/Applications/Notakillite.app build/ipa/Payload/
          (cd build/ipa && zip -qr ../Notakillite-unsigned.ipa Payload)
          plutil -p build/ipa/Payload/Notakillite.app/Info.plist | grep -E "MinimumOSVersion|DTSDKName|UIDeviceFamily" -A2
          ls -lh build/Notakillite-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Notakillite-iOS-unsigned
          path: ios/build/Notakillite-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-ios27
          path: ios/build/screenshots

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Notakillite $GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" ios/build/Notakillite-unsigned.ipa --clobber

  ipados18:
    name: iPadOS 18 compatibility · iPad tests and screenshot
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
          xcodebuild -version

      - name: Unit tests on an iPadOS 18 iPad
        working-directory: ios
        run: |
          set -o pipefail
          IPAD=$(python3 ci/pick-simulator.py iPad 18)
          echo "IPAD=$IPAD" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$IPAD"
          xcodebuild test -project Notakillite.xcodeproj -scheme Notakillite -derivedDataPath build/dd \
            -destination "id=$IPAD" CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E "error:|Test Case.*(passed|failed)|Executed|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" test.log

      - name: Screenshot on iPadOS 18
        working-directory: ios
        run: bash ci/screenshot.sh "$IPAD" build/dd/Build/Products/Debug-iphonesimulator/Notakillite.app build/screenshots/ipad-ipados18.png light

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-ipados18
          path: ios/build/screenshots
