# Generates Mentality.xcodeproj:  brew install xcodegen && xcodegen generate
name: Mentality
options:
  bundleIdPrefix: com.saudcreator
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.1
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.20

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Mentality:
    type: application
    platform: iOS
    sources: [App/Sources, App/Resources]
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saudcreator.mentality
        TARGETED_DEVICE_FAMILY: "2"          # iPad only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Mentality
        UILaunchScreen: {}
        # Keep processing after leaving the app on iPadOS 18 (silent mixable audio session).
        UIBackgroundModes: [audio]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIRequiresFullScreen: false
        # Show Documents (transcripts) in Files → On My iPad → Mentality.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # "Open in Mentality" for Notability .note exports, ZIPs and audio.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Notability note
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.saudcreator.mentality.notability-note, public.zip-archive]
          - CFBundleTypeName: Audio recording
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.mpeg-4-audio]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.saudcreator.mentality.notability-note
            UTTypeDescription: Notability Note
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [note]

  MentalityTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/Unit
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Mentality
      - package: ZIPFoundation
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.saudcreator.mentality.tests
        TARGETED_DEVICE_FAMILY: "2"

schemes:
  Mentality:
    build:
      targets:
        Mentality: all
        MentalityTests: [test]
    test:
      targets: [MentalityTests]
