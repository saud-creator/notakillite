# Generates Notakillite.xcodeproj:  brew install xcodegen && cd ios && xcodegen generate
name: Notakillite
options:
  bundleIdPrefix: com.saudcreator
  deploymentTarget:
    iOS: "18.0"   # iPhone and iPad from iOS/iPadOS 18; built with the latest (iOS 27) SDK in CI
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.1
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.20

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Notakillite:
    type: application
    platform: iOS
    sources: [Notakillite]
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saudcreator.notakillite
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Notakillite/Info.plist
      properties:
        CFBundleDisplayName: Notakillite
        UILaunchScreen: {}
        # Keep working after the user leaves the app: Continuous Background Tasks on iOS 26+
        # (Live Activity progress), silent audio session on iOS/iPadOS 18-25.
        UIBackgroundModes: [audio, processing]
        BGTaskSchedulerPermittedIdentifiers: ["$(PRODUCT_BUNDLE_IDENTIFIER).lectures.*"]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # "Open in Notakillite" for Notability .note exports, ZIPs and audio.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Notability note
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.saudcreator.notakillite.notability-note, public.zip-archive]
          - CFBundleTypeName: Audio recording
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.mpeg-4-audio]
          - CFBundleTypeName: File
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.data]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.saudcreator.notakillite.notability-note
            UTTypeDescription: Notability Note
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [note]

  NotakilliteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NotakilliteTests
      - path: ../shared/fixtures/transcript-golden.json
        buildPhase: resources
    dependencies:
      - target: Notakillite
      - package: ZIPFoundation
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.saudcreator.notakillite.tests

schemes:
  Notakillite:
    build:
      targets:
        Notakillite: all
        NotakilliteTests: [test]
    test:
      targets: [NotakilliteTests]
